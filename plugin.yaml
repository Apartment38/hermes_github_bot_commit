name: hermes-github-bot-commit
version: 0.1.0
description: Apply a bot commit identity to GitHub repositories in Hermes local tools.
author: Hermes GitHub Bot contributors
license: MIT
provides_tools: []
provides_hooks: []
provides_middleware:
  - tool_request
config_schema:
  identity:
    type: dict
    description: "Public commit attribution: app_slug and bot_id are required strings; bot_id is a positive decimal ID. Configure with hermes github-bot-commit setup."
tags: [git, github, identity]
